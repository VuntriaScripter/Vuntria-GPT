```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VuntriaGPT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b0d;
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 260px;
    background: #111114;
    border-right: 1px solid #29292e;
    padding: 15px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

.logo-icon {
    width: 36px;
    height: 36px;
    background: white;
    color: black;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
}

.new-chat {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #303037;
    background: #19191d;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

.new-chat:hover {
    background: #242429;
}

.sidebar-title {
    margin-top: 25px;
    color: #888890;
    font-size: 12px;
    text-transform: uppercase;
}

.history {
    margin-top: 10px;
}

.history-item {
    padding: 10px;
    border-radius: 8px;
    color: #d0d0d5;
    font-size: 14px;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.history-item:hover {
    background: #1c1c20;
}

/* MAIN */

.main {
    margin-left: 260px;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TOP */

.topbar {
    height: 64px;
    border-bottom: 1px solid #29292e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

.model {
    background: #18181c;
    border: 1px solid #303037;
    color: white;
    padding: 9px 12px;
    border-radius: 9px;
    outline: none;
}

.status {
    color: #8e8e96;
    font-size: 13px;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px 160px;
}

.welcome {
    max-width: 800px;
    margin: 12vh auto 0;
    text-align: center;
}

.welcome h1 {
    font-size: 42px;

}

    color: #96969e;

}

    justify-content: center;
    font-weight: bold;
}

.ai .avatar {
    background: white;
    color: black;
}

.user .avatar {
    background: #29292f;

}

.bubble {
    max-width: 750px;
    white-space: pre-wrap;

.user .bubble {

}

/* INPUT */

.composer-container {

    bottom: 0;

    );
}

.composer {

}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;

    font-family: Arial, sans-serif;
}

    color: #77777f;

.send {

    text-align: center;

}

/* MOBILE */

@media(max-width: 700px) {

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
    }

    .composer-container {
        left: 0;
    }

    .welcome h1 {
        font-size: 32px;
    }

}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        <div class="logo-icon">V</div>
        VuntriaGPT
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ Nouvelle conversation
    </button>

    <div class="sidebar-title">
        Conversations
    </div>

    <div class="history" id="history"></div>

</aside>


<!-- MAIN -->

<main class="main">

    <header class="topbar">

        <select class="model" id="model">

            <option value="gpt-5.6-luna">
                VuntriaGPT · Luna
            </option>

            <option value="gpt-5.6-sol">
                VuntriaGPT · Sol
            </option>

        </select>

        <div class="status" id="status">
            Prêt
        </div>

    </header>


    <section class="chat" id="chat">

        <div class="welcome" id="welcome">

            <h1>
                Comment puis-je t'aider ?
            </h1>

            <p>
                Bienvenue sur <b>VuntriaGPT</b>.
                Pose ta question ci-dessous.
            </p>

        </div>

        <div class="messages" id="messages"></div>

    </section>


    <div class="composer-container">

        <form class="composer" id="chatForm">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Écris un message à VuntriaGPT..."
            ></textarea>

            <button
                class="send"
                id="sendButton"
                type="submit"
            >
                ↑
            </button>

        </form>

        <div class="hint">
            Entrée pour envoyer · Maj + Entrée pour une nouvelle ligne
        </div>

    </div>

</main>


<script>

let messages = [];


// ==========================
// HISTORIQUE
// ==========================

let history =
    JSON.parse(
        localStorage.getItem("vuntriaGPT_history") || "[]"
    );


function saveHistory() {

    if (messages.length === 0) return;

    const firstUserMessage =
        messages.find(
            message => message.role === "user"
        );

    if (!firstUserMessage) return;

    history.push({

        title:
            firstUserMessage.content.substring(0, 50),

        messages: messages

    });

    history =
        history.slice(-20);

    localStorage.setItem(
        "vuntriaGPT_history",
        JSON.stringify(history)
    );

    renderHistory();
}


function renderHistory() {

    const historyElement =
        document.getElementById("history");

    historyElement.innerHTML = "";

    history
        .slice()
        .reverse()
        .forEach(item => {

            const div =
                document.createElement("div");

            div.className =
                "history-item";

            div.textContent =
                item.title;

            historyElement.appendChild(div);

        });
}


// ==========================
// NOUVELLE CONVERSATION
// ==========================

function newChat() {

    saveHistory();

    messages = [];

    renderMessages();

    document.getElementById("status").textContent =
        "Prêt";

    document.getElementById("messageInput").focus();
}


// ==========================
// AFFICHAGE
// ==========================

function renderMessages() {

    const messagesElement =
        document.getElementById("messages");

    const welcome =
        document.getElementById("welcome");

    if (messages.length > 0) {

        welcome.style.display =
            "none";

    } else {

        welcome.style.display =
            "block";

    }

    messagesElement.innerHTML = "";

    messages.forEach(message => {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message " +
            (message.role === "user"
                ? "user"
                : "ai");

        const avatar =
            document.createElement("div");

        avatar.className =
            "avatar";

        avatar.textContent =
            message.role === "user"
                ? "U"
                : "V";

        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";

        bubble.textContent =
            message.content;

        wrapper.appendChild(avatar);

        wrapper.appendChild(bubble);

        messagesElement.appendChild(wrapper);

    });

    const chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;
}


// ==========================
// ENVOI MESSAGE
// ==========================

document
    .getElementById("chatForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const input =
                document.getElementById(
                    "messageInput"
                );

            const sendButton =
                document.getElementById(
                    "sendButton"
                );

            const status =
                document.getElementById(
                    "status"
                );

            const text =
                input.value.trim();

            if (!text) return;

            messages.push({

                role: "user",

                content: text

            });

            input.value = "";

            renderMessages();

            sendButton.disabled =
                true;

            status.textContent =
                "VuntriaGPT réfléchit...";


            try {

                /*
                Le navigateur envoie le message
                à ton serveur Node.js.

                Le serveur appelle ensuite
                l'API OpenAI.

                La clé API n'est donc PAS
                présente dans ce fichier.
                */

                const response =
                    await fetch(
                        "/api/chat",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    messages:
                                        messages,

                                    model:
                                        document
                                        .getElementById(
                                            "model"
                                        )
                                        .value

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Erreur du serveur"
                    );

                }


                messages.push({

                    role:
                        "assistant",

                    content:
                        data.answer

                });


                renderMessages();

                status.textContent =
                    "Prêt";


            } catch(error) {

                messages.push({

                    role:
                        "assistant",

                    content:
                        "❌ Erreur : " +
                        error.message

                });

                renderMessages();

                status.textContent =
                    "Erreur";

            }


            sendButton.disabled =
                false;

            input.focus();

        }
    );


// ==========================
// TEXTAREA
// ==========================

const input =
    document.getElementById(
        "messageInput"
    );


input.addEventListener(
    "input",
    function() {

        input.style.height =
            "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                160
            ) + "px";

    }
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            document
                .getElementById("chatForm")
                .requestSubmit();

        }

    }
);


// ==========================
// START
// ==========================

renderHistory();

renderMessages();

input.focus();

</script>

</body>
</html>
