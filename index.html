
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VuntriaLearn</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #ffffff;
    color: #171717;
}

/* =========================
   NAVIGATION
========================= */

.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 35px;

    background: rgba(255,255,255,0.92);

    backdrop-filter: blur(15px);

    border-bottom: 1px solid #eeeeee;

    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 20px;
    font-weight: 800;
}

.logo-icon {
    width: 34px;
    height: 34px;

    border-radius: 10px;

    background: #111;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: 900;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
}

.nav-links a:hover {
    color: #000;
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 100px 20px 60px;

    text-align: center;
}

.hero h1 {
    margin: 0;

    font-size: clamp(45px, 8vw, 90px);

    letter-spacing: -0.06em;

    font-weight: 800;

    line-height: 0.95;
}

.hero h1 span {
    color: #777;
}

.subtitle {
    margin-top: 25px;

    color: #777;

    font-size: 17px;
}

/* =========================
   SEARCH
========================= */

.search-container {
    width: min(760px, 95%);

    margin-top: 45px;
}

.search-box {
    width: 100%;

    display: flex;
    align-items: center;

    padding: 7px;

    border: 1px solid #dcdcdc;

    border-radius: 18px;

    background: white;

    box-shadow:
        0 15px 45px rgba(0,0,0,0.08);
}

.search-icon {
    width: 50px;

    font-size: 21px;

    color: #888;
}

#searchInput {
    flex: 1;

    border: none;
    outline: none;

    font-size: 18px;

    padding: 17px 5px;

    color: #222;

    background: transparent;
}

#searchInput::placeholder {
    color: #aaa;
}

.search-button {
    border: none;

    background: #111;

    color: white;

    padding: 15px 22px;

    border-radius: 13px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;
}

.search-button:hover {
    background: #333;
}

/* =========================
   SUGGESTIONS
========================= */

.suggestions {
    margin-top: 22px;

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 9px;
}

.suggestion {
    padding: 9px 14px;

    border-radius: 100px;

    background: #f5f5f5;

    border: 1px solid #e8e8e8;

    color: #555;

    font-size: 13px;

    cursor: pointer;

    transition: .2s;
}

.suggestion:hover {
    background: #111;

    color: white;

    border-color: #111;
}

/* =========================
   RESULTS
========================= */

#results {
    display: none;

    width: min(1000px, 92%);

    margin: 30px auto 80px;
}

.results-title {
    font-size: 24px;

    font-weight: 750;

    margin-bottom: 20px;
}

.result-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 15px;
}

.card {
    border: 1px solid #e5e5e5;

    border-radius: 15px;

    padding: 22px;

    background: white;

    transition: .2s;
}

.card:hover {
    transform: translateY(-3px);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
}

.card-icon {
    font-size: 30px;

    margin-bottom: 12px;
}

.card h3 {
    margin: 0 0 7px;

    font-size: 17px;
}

.card p {
    margin: 0;

    color: #777;

    line-height: 1.5;

    font-size: 13px;
}

.learn-button {
    margin-top: 16px;

    display: inline-block;

    padding: 8px 12px;

    border-radius: 8px;

    background: #f1f1f1;

    color: #222;

    font-size: 12px;

    text-decoration: none;
}

/* =========================
   FOOTER
========================= */

footer {
    padding: 30px;

    border-top: 1px solid #eee;

    text-align: center;

    color: #999;

    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 650px) {

    .navbar {
        padding: 0 15px;
    }

    .nav-links {
        display: none;
    }

    .hero {
        padding-top: 100px;
    }

    .hero h1 {
        font-size: 52px;
    }

    .search-box {
        padding: 6px;
    }

    #searchInput {
        font-size: 16px;
    }

    .search-button {
        padding: 13px 15px;
    }
}
</style>
</head>

<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav class="navbar">

    <div class="logo">

        <div class="logo-icon">
            V
        </div>

        VuntriaLearn

    </div>


    <div class="nav-links">

        <a href="#">
            Accueil
        </a>

        <a href="#results">
            Explorer
        </a>

        <a href="#">
            À propos
        </a>

    </div>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        Je veux<br>
        <span>apprendre</span>
    </h1>


    <div class="subtitle">

        Qu'est-ce que tu aimerais apprendre aujourd'hui ?

    </div>


    <!-- SEARCH -->

    <div class="search-container">

        <div class="search-box">

            <div class="search-icon">
                🔎
            </div>

            <input
                id="searchInput"
                type="text"
                placeholder="Ex : Python, histoire, maths..."
                autocomplete="off"
            >

            <button
                class="search-button"
                onclick="searchTopic()"
            >
                Rechercher
            </button>

        </div>


        <!-- SUGGESTIONS -->

        <div class="suggestions">

            <div
                class="suggestion"
                onclick="setTopic('Python')"
            >
                🐍 Python
            </div>

            <div
                class="suggestion"
                onclick="setTopic('JavaScript')"
            >
                🌐 JavaScript
            </div>

            <div
                class="suggestion"
                onclick="setTopic('Mathématiques')"
            >
                📐 Mathématiques
            </div>

            <div
                class="suggestion"
                onclick="setTopic('Histoire')"
            >
                📚 Histoire
            </div>

            <div
                class="suggestion"
                onclick="setTopic('Anglais')"
            >
                🇬🇧 Anglais
            </div>

            <div
                class="suggestion"
                onclick="setTopic('Intelligence artificielle')"
            >
                🤖 IA
            </div>

        </div>

    </div>

</section>


<!-- =========================
     RESULTS
========================= -->

<section id="results">

    <div
        class="results-title"
        id="resultsTitle"
    >
        Résultats
    </div>


    <div
        class="result-grid"
        id="resultGrid"
    ></div>

</section>


<!-- =========================
     FOOTER
========================= -->

<footer>

    © 2026 VuntriaLearn · Apprendre quelque chose de nouveau chaque jour.

</footer>


<script>

/* =========================
   SUJETS
========================= */

const topics = {

    "python": {
        icon: "🐍",
        title: "Python",
        description:
            "Apprends les bases de Python, les variables, les fonctions et la programmation.",
    },

    "javascript": {
        icon: "🌐",
        title: "JavaScript",
        description:
            "Découvre JavaScript et apprends à créer des sites web interactifs.",
    },

    "mathématiques": {
        icon: "📐",
        title: "Mathématiques",
        description:
            "Révise les calculs, l'algèbre, la géométrie et les notions importantes.",
    },

    "maths": {
        icon: "📐",
        title: "Mathématiques",
        description:
            "Révise les calculs, l'algèbre, la géométrie et les notions importantes.",
    },

    "histoire": {
        icon: "📚",
        title: "Histoire",
        description:
            "Explore les grandes périodes historiques et les événements importants.",
    },

    "anglais": {
        icon: "🇬🇧",
        title: "Anglais",
        description:
            "Améliore ton vocabulaire, ta grammaire et ta compréhension de l'anglais.",
    },

    "intelligence artificielle": {
        icon: "🤖",
        title: "Intelligence artificielle",
        description:
            "Comprends les bases de l'IA, du machine learning et des modèles de langage.",
    },

    "ia": {
        icon: "🤖",
        title: "Intelligence artificielle",
        description:
            "Découvre comment fonctionnent les intelligences artificielles modernes.",
    }

};


/* =========================
   RECHERCHE
========================= */

function searchTopic() {

    const input =
        document
        .getElementById("searchInput");

    const query =
        input.value.trim();

    if (!query) {

        input.focus();

        return;

    }


    const normalized =
        query.toLowerCase();


    const results =
        document.getElementById("results");

    const grid =
        document.getElementById("resultGrid");

    const title =
        document.getElementById("resultsTitle");


    results.style.display =
        "block";


    title.textContent =
        "Apprendre : " + query;


    grid.innerHTML = "";


    let found =
        topics[normalized];


    if (found) {

        addCard(found);

    } else {

        /*
        Si le sujet n'existe pas
        dans notre liste, on crée
        automatiquement une carte
        avec le sujet recherché.
        */

        addCard({

            icon: "📖",

            title:
                "Apprendre " + query,

            description:
                "Commence ton apprentissage de " +
                query +
                " avec VuntriaLearn."

        });

        addCard({

            icon: "🧠",

            title:
                "Bases de " + query,

            description:
                "Découvre les notions essentielles " +
                "et progresse étape par étape."

        });

        addCard({

            icon: "🚀",

            title:
                "Aller plus loin",

            description:
                "Approfondis tes connaissances " +
                "et développe tes compétences."

        });

    }


    results.scrollIntoView({

        behavior: "smooth"

    });

}


/* =========================
   CARTE
========================= */

function addCard(topic) {

    const grid =
        document.getElementById(
            "resultGrid"
        );


    const card =
        document.createElement("div");

    card.className =
        "card";


    card.innerHTML = `

        <div class="card-icon">
            ${topic.icon}
        </div>

        <h3>
            ${escapeHtml(topic.title)}
        </h3>

        <p>
            ${escapeHtml(topic.description)}
        </p>

        <a
            href="#"
            class="learn-button"
            onclick="startLearning(event, '${escapeHtml(topic.title)}')"
        >
            Commencer →
        </a>

    `;


    grid.appendChild(card);

}


/* =========================
   SÉLECTION RAPIDE
========================= */

function setTopic(topic) {

    const input =
        document.getElementById(
            "searchInput"
        );


    input.value =
        topic;


    input.focus();


    searchTopic();

}


/* =========================
   APPRENDRE
========================= */

function startLearning(event, topic) {

    event.preventDefault();


    alert(
        "Bienvenue dans ton parcours : " +
        topic +
        " !\n\n" +
        "Cette partie peut ensuite être reliée " +
        "à un cours, une IA ou une base de données."
    );

}


/* =========================
   SÉCURITÉ HTML
========================= */

function escapeHtml(text) {

    return text.replace(
        /[&<>"']/g,
        function(character) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[character];

        }
    );

}


/* =========================
   ENTRÉE CLAVIER
========================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                searchTopic();

            }

        }
    );

</script>

</body>
</html>
```
